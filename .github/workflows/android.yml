name: P7 Station - APK Android
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOLS_URL: https://github.com/mmatyas/pegasus-frontend/releases/download/alpha1
  QT_TARGET: android
  QT_VERSION: qt51510
  QT_VERSION_PRETTY: "5.15.10"

jobs:
  android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0, fetch-tags: true}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Instalar Qt para Android
        run: |
          .circleci/prepare.sh
          curl -L ${TOOLS_URL}/openssl-111t_android.tar.xz | tar xJf - -C /opt/

      - name: Compilar
        env:
          BUILDOPTS: ANDROID_ABIS=arm64-v8a FORCE_QT_PNG=1
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: .circleci/build.sh

      # Assina com a chave do P7 Station (segredos P7_KEYSTORE_B64 e P7_KEYSTORE_PASS).
      # Sem os segredos, gera uma versão de teste (debug), que instala mas não atualiza por cima.
      - name: Empacotar APK
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          P7_KEYSTORE_B64: ${{ secrets.P7_KEYSTORE_B64 }}
          P7_KEYSTORE_PASS: ${{ secrets.P7_KEYSTORE_PASS }}
        run: |
          set -e
          VERSION="1.0.$(git rev-list --count HEAD)"
          echo "P7_VERSION=$VERSION" >> "$GITHUB_ENV"
          DEPLOY=/opt/${QT_VERSION}_${QT_TARGET}/bin/androiddeployqt
          ARGS="--input src/app/android-pegasus-fe-deployment-settings.json --output ${PWD}/installdir --android-platform android-30 --gradle"
          if [ -n "$P7_KEYSTORE_B64" ]; then
            echo "$P7_KEYSTORE_B64" | base64 -d > p7station.keystore
            $DEPLOY $ARGS --sign ./p7station.keystore p7station --storepass "$P7_KEYSTORE_PASS" --keypass "$P7_KEYSTORE_PASS"
            cp installdir/build/outputs/apk/release/installdir-release-signed.apk "dist/P7-Station-${VERSION}.apk"
            rm -f p7station.keystore
          else
            $DEPLOY $ARGS
            cp installdir/build/outputs/apk/debug/installdir-debug.apk "dist/P7-Station-${VERSION}-teste.apk"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: P7-Station-apk
          path: dist/*.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.P7_VERSION }}
          name: P7 Station ${{ env.P7_VERSION }}
          body: Instale o arquivo .apk no tablet (permita instalar apps desta fonte quando o Android pedir).
          files: dist/*.apk
